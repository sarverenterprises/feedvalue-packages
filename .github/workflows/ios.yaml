name: iOS SDK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual triggers

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        working-directory: packages/ios
        run: swift build -v

      - name: Run Tests
        working-directory: packages/ios
        run: swift test -v

      - name: Upload Test Results
        uses: sarverenterprises/ci-artifacts/upload@398206bcca4467193ec4cf14d58ef50e4e6dda3e
        # A fork pull request gets no organisation secrets, so skip the
        # upload there instead of failing the job.
        if: always() && vars.R2_CI_BUCKET != ''
        with:
          name: ios-test-results
          path: packages/ios/.build/
        env:
          R2_CI_ACCESS_KEY_ID: ${{ secrets.R2_CI_ACCESS_KEY_ID }}
          R2_CI_SECRET_ACCESS_KEY: ${{ secrets.R2_CI_SECRET_ACCESS_KEY }}
          R2_CI_ENDPOINT: ${{ vars.R2_CI_ENDPOINT }}
          R2_CI_BUCKET: ${{ vars.R2_CI_BUCKET }}

  lint:
    name: Swift Lint
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SwiftLint
        working-directory: packages/ios
        run: |
          if command -v swiftlint &> /dev/null; then
            swiftlint lint --strict
          else
            echo "SwiftLint not installed, skipping lint check"
            exit 0
          fi
