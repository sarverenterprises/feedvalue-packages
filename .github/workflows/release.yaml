name: Release

on:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest # required for npmjs oidc support
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Detect pending changesets
        id: pending_changesets
        shell: bash
        run: |
          set -euo pipefail

          if find .changeset -type f -name '*.md' ! -name 'README.md' -print -quit | grep -q .; then
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release PR token
        if: steps.pending_changesets.outputs.has_pending == 'true'
        env:
          CHANGESETS_BOT_TOKEN: ${{ secrets.CHANGESETS_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CHANGESETS_BOT_TOKEN:-}" ]; then
            printf '%s\n' \
              'Pending changesets require the Release workflow to create or update a version PR.' \
              'Configure the CHANGESETS_BOT_TOKEN repository secret with an approved bot token' \
              'that can push branches and create pull requests before merging changesets.' >&2
            exit 1
          fi

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release:oidc
          version: pnpm run version
          title: 'chore: version packages'
          commit: 'chore: version packages'
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
