name: Android SDK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual triggers

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build
        working-directory: packages/android
        run: ./gradlew build --no-daemon

      - name: Run Unit Tests
        working-directory: packages/android
        run: ./gradlew test --no-daemon

      - name: Upload Test Results
        uses: sarverenterprises/ci-artifacts/upload@c14f99f2419e01acd895daec7c0aed2206ac0b87
        # A fork pull request gets no organisation secrets, so skip the
        # upload there instead of failing the job.
        if: always() && vars.R2_CI_BUCKET != ''
        with:
          name: android-test-results
          path: packages/android/feedvalue/build/reports/tests/
        env:
          R2_CI_ACCESS_KEY_ID: ${{ secrets.R2_CI_ACCESS_KEY_ID }}
          R2_CI_SECRET_ACCESS_KEY: ${{ secrets.R2_CI_SECRET_ACCESS_KEY }}
          R2_CI_ENDPOINT: ${{ vars.R2_CI_ENDPOINT }}
          R2_CI_BUCKET: ${{ vars.R2_CI_BUCKET }}

  lint:
    name: Kotlin Lint
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Run Android Lint
        working-directory: packages/android
        run: ./gradlew lint --no-daemon

      - name: Upload Lint Results
        uses: sarverenterprises/ci-artifacts/upload@c14f99f2419e01acd895daec7c0aed2206ac0b87
        # A fork pull request gets no organisation secrets, so skip the
        # upload there instead of failing the job.
        if: always() && vars.R2_CI_BUCKET != ''
        with:
          name: android-lint-results
          path: packages/android/feedvalue/build/reports/lint-results*.html
        env:
          R2_CI_ACCESS_KEY_ID: ${{ secrets.R2_CI_ACCESS_KEY_ID }}
          R2_CI_SECRET_ACCESS_KEY: ${{ secrets.R2_CI_SECRET_ACCESS_KEY }}
          R2_CI_ENDPOINT: ${{ vars.R2_CI_ENDPOINT }}
          R2_CI_BUCKET: ${{ vars.R2_CI_BUCKET }}
